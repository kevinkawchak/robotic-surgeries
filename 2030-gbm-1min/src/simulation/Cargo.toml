[package]
name = "gbm_runner_1min"
version = "3.9.1"
edition = "2021"

[[bin]]
name = "gbm_runner_1min"
path = "runner_1min.rs"

[features]
default = []
cuda = []

[dependencies]
rand_pcg = "0.3"
rand = "0.8"
arrow = "53"
parquet = { version = "53", features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossbeam-channel = "0.5"
