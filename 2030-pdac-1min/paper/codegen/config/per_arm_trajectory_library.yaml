# Per arm per phase target trajectory library.
# Contains 64 trajectories (8 arms x 8 phases) plus 16 anastomosis sub trajectories.
# Part of the deterministic seed contract.

defaults:
  duration_s_default: 1.0
  waypoint_spacing_ms: 100

