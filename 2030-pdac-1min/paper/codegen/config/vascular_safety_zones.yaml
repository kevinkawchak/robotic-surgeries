# Vascular safety zone configuration for PAT-PDAC-0001.
# Five named vessels with nested cylindrical no fly, soft warning, and hard
# stop volumes. Coordinates are in the patient frame (mm); origin = umbilicus.
# Part of the deterministic seed contract.

vessels:
  - name: superior_mesenteric_vein
    centerline_start: {x_mm: 15, y_mm: -25, z_mm: -45}
    centerline_end: {x_mm: 15, y_mm: -65, z_mm: -55}
    length_mm: 40
    hard_stop_radius_mm: 2.0
    soft_warning_radius_mm: 4.0
    no_fly_radius_mm: 6.0
    active_phases: [2, 4, 5, 8]
  - name: portal_vein
    centerline_start: {x_mm: 5, y_mm: -55, z_mm: -55}
    centerline_end: {x_mm: 5, y_mm: -75, z_mm: -50}
    length_mm: 20
    hard_stop_radius_mm: 2.0
    soft_warning_radius_mm: 4.0
    no_fly_radius_mm: 6.0
    active_phases: [2, 4, 5, 8]
  - name: hepatic_artery_common
    centerline_start: {x_mm: 5, y_mm: -60, z_mm: -50}
    centerline_end: {x_mm: 20, y_mm: -65, z_mm: -55}
    length_mm: 18
    hard_stop_radius_mm: 1.5
    soft_warning_radius_mm: 3.0
    no_fly_radius_mm: 5.0
    active_phases: [2, 4, 6, 8]
  - name: celiac_axis
    centerline_start: {x_mm: 0, y_mm: -65, z_mm: -60}
    centerline_end: {x_mm: 5, y_mm: -70, z_mm: -55}
    length_mm: 8
    hard_stop_radius_mm: 1.5
    soft_warning_radius_mm: 3.0
    no_fly_radius_mm: 5.0
    active_phases: [3, 4, 8]
  - name: superior_mesenteric_artery
    centerline_start: {x_mm: 0, y_mm: -35, z_mm: -55}
    centerline_end: {x_mm: 5, y_mm: -65, z_mm: -60}
    length_mm: 30
    hard_stop_radius_mm: 1.5
    soft_warning_radius_mm: 3.0
    no_fly_radius_mm: 5.0
    active_phases: [3, 4, 8]

actions:
  clear:
    velocity_scale: 1.0
    force_soft_cap_n: 3.0
    e_stop: false
  no_fly:
    velocity_scale: 0.5
    force_soft_cap_n: 2.5
    e_stop: false
  soft_warning:
    velocity_scale: 0.1
    force_soft_cap_n: 1.5
    e_stop: false
  hard_stop:
    velocity_scale: 0.0
    force_soft_cap_n: 0.0
    e_stop: true
    e_stop_latency_budget_us: 10
    per_arm_park_budget_us: 50
